    function appendHeaderData(platforminfo) {
        for (var i in platforminfo) {
            if (platforminfo[i]) {
                var nodeToCreate = document.createElement("span");
                nodeToCreate.id = i;
                nodeToCreate.className = 'bold';
                nodeToCreate.innerHTML = "<div class='list-item-background even-space-row' style='max-width: 450px;'> <div class='col-xs-6 even-space-col'><span style='font-weight: bold;'>" + i + "</span></div>" + "<div class='col-xs-6 even-space-col' style='border-left: 1px solid #ddd;'>" + platforminfo[i] + "</div></div>";
                document.getElementById("productInfoContainer").appendChild(nodeToCreate);
            }
        }

    function createTables(summaryData, entries) {
        for (var i = 0; i < summaryData.length; i++) {
            var table = document.createElement('table');
            var tablerow = table.insertRow(-1);
            tablerow.className = "uefiBlue";

            var newTh = document.createElement('th');
            newTh.innerHTML = "Name";
            newTh.style.width = "100px";
            tablerow.appendChild(newTh);

            newTh = document.createElement('th');
            //newTh.innerHTML = "Total Runs Conducted";
            newTh.innerHTML = "Runs";
            newTh.style.width = "35px";
            tablerow.appendChild(newTh);

            newTh = document.createElement('th');
            newTh.innerHTML = "Result";
            newTh.style.width = "50px";
            tablerow.appendChild(newTh);

            newTh = document.createElement('th');
            newTh.innerHTML = "Runtime";
            newTh.style.width = "40px";
            tablerow.appendChild(newTh);

            newTh = document.createElement('th');
            newTh.innerHTML = "Details";
            tablerow.appendChild(newTh);
            newTh.style.width = "40px";
            table.appendChild(tablerow);

            document.getElementById("tablesContainer").appendChild(table);
            var newrow = table.insertRow(-1);
            var stressorname = newrow.insertCell(0);
            stressorname.innerHTML = summaryData[i]['Name'] + ' (' +entries[i]['Instance'] +')';
            stressorname.className = "AlignCenter";
            var totalruns = newrow.insertCell(1);
            totalruns.innerHTML = summaryData[i]['TotalRuns'];
            totalruns.className = "AlignCenter";
            var result = newrow.insertCell(2);
            var resultToAdd = getResult(summaryData[i]['LastResult']);
            result.innerHTML = resultToAdd;
            result.id = summaryData[i]['LastResult'];
            var className = getResultTypeClass(summaryData[i]['LastRunResultType']);
            result.className = "AlignCenter " + className;
            var totalruntime = newrow.insertCell(3);
            totalruntime.innerHTML = summaryData[i]['TotalRunTime'];
            totalruntime.className = "AlignCenter";
            var buttonrow = newrow.insertCell(4);
            buttonrow.className = "AlignCenter";
            var button = document.createElement('button');
            button.id = 'tog' + summaryData[i]['Id'];
            button.innerHTML = "Show";
            //NEW
            button.Tag =i;
            button.onclick = function () {
                var testName = this.id.substring(3, this.id.length);
                toggleTable('tbl'+ this.Tag, testName);
            }
            buttonrow.appendChild(button);
            createResultHeaderRow(summaryData[i],i);
            for (var k = 0; k < entries.length; k++) {
                if (entries[k]['Id'] == summaryData[i]['Id'] && entries[k]['Instance'] == summaryData[i] ['Instance']) {
                    var entry = entries[k]['ToolName'];
                    var entry2 = summaryData[i]['Name'];
                    createLogTables(entries[k], i, k); //NEW
                }
            }
            table.appendChild(newrow);
            var linebreak = document.createElement('p');
            document.getElementById("tablesContainer").appendChild(linebreak);
        }
    }
    function createResultHeaderRow(summaryData,i) {

        newTh.innerHTML = "Name";

        newTh.innerHTML = "Instance";

        newTh.innerHTML = "Version";
        tablerow.appendChild(newTh);

        newTh.innerHTML = "StartTime";
        tablerow.appendChild(newTh);

    function insertCell(newrow, cellNum, innerHtml, className) {
        newTd = newrow.insertCell(cellNum);
        newTd.innerHTML = innerHtml;
        newTd.className = className;         
        return newTd;
    }
    function createLogTables(entry, summary, runid) {
        var table = document.getElementById('tbl' + summary);
        var newrow = table.insertRow(-1);
        var i=0;
        insertCell(newrow, i++, entry['ToolName'], "AlignCenter");
        insertCell(newrow, i++, entry['Instance'], "AlignCenter");
        insertCell(newrow, i++, entry['ToolVersion'], "AlignCenter");
        insertCell(newrow, i++, entry['FormattedStartTime'], "AlignCenter");
        insertCell(newrow, i++, entry['FormattedStopTime'], "AlignCenter");
        insertCell(newrow, i++, entry['FormattedElapsedTime'], "AlignCenter");
        insertCell(newrow, i++, entry['ErrorCode'], "AlignCenter");
        insertCell(newrow, i++, entry['FailureId'], "AlignCenter");
        newTd=insertCell(newrow, i++, getResult(entry['FormattedResult']), "AlignCenter " + getResultTypeClass(entry.ResultType));
        newTd.id = entry['Result'];
        newTd = newrow.insertCell(i++);
        table.appendChild(newrow);
        if (entry['LogData'] == null || entry['LogData'] == "") {
            newTd.innerHTML = "";
        }
        else {
            var ssd = entry['ToolName'].substring(0, 3);
            var button = document.createElement('button');

            button.innerHTML = "ShowLog";
            button.id = 'tog' + ssd + runid.toString();
            button.className = "AlignCenter";
            button.onclick = function () {
                var idtoToggle = this.id.substring(3, this.id.length);
                toggleRow(idtoToggle);
            }
            newTd.className = "AlignCenter";
            newTd.appendChild(button);
            newrow = table.insertRow(-1);
            newrow.style.display = "none";
            newrow.id = ssd + runid.toString();
            newTd = newrow.insertCell(0);
            var logdata = entry['LogData'];
            logdata = logdata.replace(/(\r\n|\n|\r)/g, "<br />");
            newTd.innerHTML = logdata;
            newTd.id = ssd + runid.toString() + "loginfo";
            newTd.className = 'AlignLeftFontSize';
            document.getElementById(ssd + runid.toString() + "loginfo").colSpan = 7;
            table.appendChild(newrow);
        }
    }

    function getResultTypeClass(resultType) {
        var className = "";
        if (resultType == 1) {
            className = "passed";
        }
        else if (resultType == 2) {
            className = "failed";
        }
        return className;
    }

    // TODO: cancel will return passed
    function getResult(result) {
        return result;
        //if (result == "ExecutionFailed")
        //    return result;
        //return "ExecutionPassed";
    }
    function toggleTable(tname,bname)
    {
        var elem=document.getElementById(tname);
        var button=document.getElementById("tog"+ bname);
        var hide=elem.style.display =="none";
        if (hide) {
            elem.style.display="table";
            button.innerHTML = "Hide";
        }
        else {
            elem.style.display="none";
            button.innerHTML = "Show";
        }
    }

</script>
<script type="text/javascript">
    function toggleRow(Rname)
    {
        var elem=document.getElementById(Rname);
        var button=document.getElementById("tog"+ Rname);
        var hide = elem.style.display =="none";
        if (hide) {
            elem.style.display="";
            button.innerHTML = "HideLog";
        }
        else {
            elem.style.display="none";
            button.innerHTML = "ShowLog";
        }
    }

    function toggleInfoDisplay() {
        var elem = document.getElementById("productInfoContainer");
        var hide=elem.style.display =="none";
        if (hide) {
            elem.style.display = "block";
        }
        else {
            elem.style.display = "none";
        }

        var desiredWidth = window.innerWidth;

        var headerHeight = (document.getElementById("mainNav") || {}).offsetHeight;
        var windowHeight = window.innerHeight;

        var platformInfoElem = document.getElementById("tablesContainer");

        var elemHeight = document.getElementById("PlatformInfo").offsetHeight;

        var otherHeight = document.getElementById("productInfoContainer").clientHeight;

        var desiredHeight = windowHeight - headerHeight - (elemHeight - platformInfoElem.offsetHeight) - 75;

        platformInfoElem.style.height = desiredHeight + "px";
    }

</script>
